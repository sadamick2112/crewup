server:
  # Overridable in .env (plan §4); the Vite dev server's /api proxy reads the same variable.
  port: ${CREWUP_BACKEND_PORT:8080}

spring:
  application:
    name: crewup
  config:
    # One config file for Compose and the backend (plan §4). Run from backend/, so .env is one level up.
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${CREWUP_DB_PORT}/${CREWUP_DB_NAME}
    username: ${CREWUP_DB_USER}
    password: ${CREWUP_DB_PASSWORD}
  flyway:
    # One folder per module (db/migration/<module>/), with timestamp versions so folders never collide.
    locations: classpath:db/migration/*
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  web:
    resources:
      # The API serves no static files. Without the catch-all /** resource handler, an unknown /api path matches no
      # route (logged as UNMATCHED) and gets a 404 Problem Details. springdoc serves Swagger UI with its own handler.
      add-mappings: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CREWUP_OIDC_ISSUER_URI}
          # Rejects tokens issued for other clients (M0-4). Boot applies this only to the JwtDecoder it builds:
          # if a custom JwtDecoder bean is ever added, it must add this audience check itself.
          audiences: crewup-api

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      # Component names and status (db, ping) are public; details such as the database product are not.
      show-components: always
      show-details: never
  tracing:
    # W3C traceparent in and out (M0-27). Sampling only matters once an exporter exists; trace IDs are always logged.
    propagation:
      type: w3c
    sampling:
      probability: 1.0

logging:
  # Overridable per environment, e.g. LOGGING_LEVEL_APP_CREWUP=DEBUG.
  level:
    root: INFO
    app.crewup: INFO
  # Boot's default console pattern plus %kvp, so key-values (LOG-1) show in readable local logs. JSON logs
  # (LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs) ignore this pattern and write key-values as fields. \${PID:-} is escaped
  # so Logback, not Spring, resolves it.
  pattern:
    console: '%clr(%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}){faint} %clr(%5p){} %clr(\${PID:-}){magenta} %clr(--- %esb(){APPLICATION_NAME}%esb{APPLICATION_GROUP}[%15.15t] %correlationId){faint}%clr(%-40.40logger{39}){cyan} %clr(:){faint} %m %kvp%n%wEx'
