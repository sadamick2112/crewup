# CodeQL for every pull request to main and every push to main (M0-15, plan §7). Semgrep and gitleaks run in
# security.yml. The failure threshold ("High or higher") is a repository setting (plan §9), not part of this file.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the job only reads the repository; it adds what the results upload needs.
permissions:
  contents: read

# A newer push to a PR cancels the run it supersedes. Every push to main keeps its run.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # build-mode none: CodeQL reads the Java sources without compiling them, so no JDK or Maven build is needed.
        language: [java-kotlin, javascript-typescript]
    steps:
      # Actions are pinned by commit SHA (plan §7); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # .semgrep/ holds the Semgrep rule fixtures, which contain insecure code on purpose (SQL built by string
      # concatenation, dangerouslySetInnerHTML) so the rules have something to find. It is not application code.
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - .semgrep

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
