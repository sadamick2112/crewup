# Build, test, lint and coverage for every pull request to main and every push to main (M0-12, M0-24, plan §9).
# The Playwright end-to-end test runs locally in M0 and joins CI in M8 (spec §6 decision 3).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A newer push to a PR cancels the run it supersedes. Every push to main keeps its run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      # Actions are pinned by commit SHA (plan §7); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Unit and Testcontainers integration tests, ModularityTests, OpenApiContractTest, spotless:check and the
      # JaCoCo gate. Docker is preinstalled on ubuntu-latest.
      - name: Build and test
        run: ./mvnw -B verify

      # JaCoCo writes its CSV before the gate runs, so the table also shows when coverage is too low.
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('backend/target/site/jacoco/jacoco.csv') != '' }}
        run: |
          awk -F, 'NR > 1 { bm += $6; bc += $7; lm += $8; lc += $9 }
            function row(name, covered, missed, limit) {
              total = covered + missed
              printf "| %s | %d / %d | %.1f%% | %d%% |\n", name, covered, total, total ? 100 * covered / total : 100, limit
            }
            END {
              print "### Backend coverage (JaCoCo)"
              print ""
              print "| Metric | Covered | Percent | Minimum |"
              print "| --- | --- | --- | --- |"
              row("Lines", lc, lm, 80)
              row("Branches", bc, bm, 70)
            }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('backend/target/site/jacoco/index.html') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

      # Vitest writes the summary even when a threshold fails, so the table also shows when coverage is too low.
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('frontend/coverage/coverage-summary.json') != '' }}
        run: |
          node - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          const { total } = JSON.parse(require("node:fs").readFileSync("coverage/coverage-summary.json", "utf8"));
          const row = (name, m, limit) => `| ${name} | ${m.covered} / ${m.total} | ${m.pct.toFixed(1)}% | ${limit}% |`;
          console.log([
            "### Frontend coverage (Vitest)",
            "",
            "| Metric | Covered | Percent | Minimum |",
            "| --- | --- | --- | --- |",
            row("Lines", total.lines, 80),
            row("Branches", total.branches, 70),
          ].join("\n"));
          EOF

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('frontend/coverage/index.html') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # Fails if the committed API client is stale compared with api/openapi.json (M0-9).
  api-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run gen:api
      - name: Check the generated client is committed
        run: git diff --exit-code src/shared/api
